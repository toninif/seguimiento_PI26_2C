<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de casos válidos</title>
<style>
  :root{
    --bg:#F4F5F2;
    --ink:#20262B;
    --ink-soft:#5B6570;
    --line:#D8DBD6;
    --ok:#1F6F63;
    --ok-bg:#E3EEE9;
    --pend:#B8752B;
    --pend-bg:#F3E7D6;
    --card:#FFFFFF;
    --sub-bg:#FAFAF8;
    --accent-a:#1F6F63;
    --accent-b:#7A5C9E;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .updated { font-size: 13px; color: var(--ink-soft); font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }

  .total-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; margin-bottom: 24px;
  }
  .total-numbers { display:flex; align-items:baseline; gap:8px; margin-bottom: 10px; }
  .total-numbers .big { font-family: ui-monospace, Menlo, monospace; font-size: 32px; font-weight: 600; }
  .total-numbers .of { font-size: 15px; color: var(--ink-soft); }
  .bar-track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--ok); border-radius: 4px; transition: width .4s ease; }

  .groups { display: grid; gap: 14px; }
  .group-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px;
  }
  .group-top { display:flex; justify-content: space-between; align-items:center; margin-bottom: 8px; gap: 8px; }
  .group-name { font-weight: 600; font-size: 15px; }
  .group-count { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .group-count strong { color: var(--ink); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.pend { background: var(--pend-bg); color: var(--pend); }

  .toggle-btn {
    font-size: 12px; font-weight: 600; color: var(--ink-soft);
    background: var(--sub-bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; cursor: pointer; margin-top: 10px;
  }
  .toggle-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  .group-details[hidden] { display: none; }

  .meter-row { display:grid; grid-template-columns: 64px 1fr 46px; align-items:center; gap:8px; margin-top:6px; }
  .meter-label { font-size: 11px; color: var(--ink-soft); }
  .meter-track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 3px; transition: width .4s ease; }
  .meter-fill.a { background: var(--accent-a); }
  .meter-fill.b { background: var(--accent-b); }
  .meter-num { font-size: 11px; font-family: ui-monospace, Menlo, monospace; color: var(--ink-soft); text-align:right; }

  .age-block { margin: 10px 0 4px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .age-title { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }

  .students { margin-top: 12px; display: grid; gap: 8px; }
  .student-card {
    background: var(--sub-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px;
  }
  .student-top { display:flex; justify-content: space-between; align-items:center; gap:8px; margin-bottom: 2px; }
  .student-name { font-size: 13px; font-weight: 600; }
  .student-count { font-size: 11px; font-family: ui-monospace, Menlo, monospace; color: var(--ink-soft); }
  .badge.small { font-size: 10px; padding: 1px 6px; }

  .empty { text-align:center; color: var(--ink-soft); padding: 40px 0; font-size: 14px; }
  footer { text-align:center; font-size: 12px; color: var(--ink-soft); margin-top: 32px; }

  @media (max-width: 420px){
    .meter-row { grid-template-columns: 52px 1fr 38px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Seguimiento de casos válidos</h1>
      <div class="updated" id="actualizado">Cargando…</div>
    </header>

    <div class="total-card">
      <div class="total-numbers">
        <span class="big" id="total-validos">–</span>
        <span class="of" id="total-meta">de – casos válidos en total</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="total-bar" style="width:0%"></div></div>
    </div>

    <div class="groups" id="groups"></div>
    <div class="empty" id="empty" style="display:none">No se pudo cargar el progreso todavía.</div>

    <footer>Se actualiza cada vez que se sube una nueva medición.</footer>
  </div>

<script>
function meterRow(label, n, meta, cls) {
  const pct = meta > 0 ? Math.min(100, Math.round(100 * n / meta)) : 0;
  return `
    <div class="meter-row">
      <span class="meter-label">${label}</span>
      <div class="meter-track"><div class="meter-fill ${cls}" style="width:${pct}%"></div></div>
      <span class="meter-num">${n}/${meta}</span>
    </div>
  `;
}

function studentCard(e) {
  const completo = e.completo;
  return `
    <div class="student-card">
      <div class="student-top">
        <span class="student-name">${e.nombre}</span>
        <span class="badge small ${completo ? 'ok' : 'pend'}">${completo ? 'Completo' : `${e.faltan_varones + e.faltan_mujeres} por conseguir`}</span>
      </div>
      <div class="student-count">${e.casos_validos} caso(s) válido(s)</div>
      ${meterRow('Varones', e.varones, e.meta_varones, 'a')}
      ${meterRow('Mujeres', e.mujeres, e.meta_mujeres, 'b')}
    </div>
  `;
}

function groupCard(g) {
  const card = document.createElement('div');
  card.className = 'group-card' + (g.completo ? '' : ' pend');
  card.innerHTML = `
    <div class="group-top">
      <span class="group-name">Grupo ${g.grupo}</span>
      <span class="badge ${g.completo ? 'ok' : 'pend'}">${g.completo ? 'Completo' : `${g.faltan} por conseguir`}</span>
    </div>
    <div class="group-count"><strong>${g.casos_validos}</strong> / ${g.meta} casos válidos · ${g.n_estudiantes} alumno(s)</div>
    <div class="bar-track"><div class="bar-fill" style="width:${g.meta > 0 ? Math.min(100, Math.round(100 * g.casos_validos / g.meta)) : 0}%"></div></div>

    <button type="button" class="toggle-btn">Mostrar detalle</button>

    <div class="group-details" hidden>
      <div class="age-block">
        <div class="age-title">Rango etario</div>
        ${meterRow('18 a 30', g.edad_18_30, g.meta_edad, 'a')}
        ${meterRow('31 o más', g.edad_31_mas, g.meta_edad, 'b')}
      </div>

      <div class="students">
        ${g.estudiantes.map(studentCard).join('')}
      </div>
    </div>
  `;

  const btn = card.querySelector('.toggle-btn');
  const details = card.querySelector('.group-details');
  btn.addEventListener('click', () => {
    const abierto = !details.hidden;
    details.hidden = abierto;
    btn.textContent = abierto ? 'Mostrar detalle' : 'Ocultar detalle';
  });

  return card;
}

fetch('progreso.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    document.getElementById('actualizado').textContent = 'Actualizado: ' + data.actualizado;
    document.getElementById('total-validos').textContent = data.total_casos_validos;
    document.getElementById('total-meta').textContent = 'de ' + data.total_meta + ' casos válidos en total';
    const pct = Math.min(100, Math.round(100 * data.total_casos_validos / data.total_meta));
    document.getElementById('total-bar').style.width = pct + '%';

    const cont = document.getElementById('groups');
    data.grupos.forEach(g => cont.appendChild(groupCard(g)));
  })
  .catch(() => {
    document.getElementById('empty').style.display = 'block';
  });
</script>
</body>
</html>
